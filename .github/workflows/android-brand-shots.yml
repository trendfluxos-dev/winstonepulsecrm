name: Android brand screenshots

# Boots an emulator, installs the agent test APK plus the offline sandbox build,
# and captures the logo/white theme on key screens. Screenshots are saved to the
# apk-builds branch (screens/<version>/) because artifact storage can hit quota.
# No secrets, no sign-in, no CRM traffic (sandbox CRM_BASE_URL is invalid).

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-brand-shots.yml"
      - ".github/scripts/android-brand-shots.sh"

concurrency:
  group: android-brand-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space for the SDK and emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
            /usr/lib/mono /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: Export one SDK location
        run: echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build test APK, sandbox APK and sandbox test APK
        working-directory: android
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleSandbox assembleSandboxAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SHOTS: /tmp/brand-shots
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          pre-emulator-launch-script: |
            printf 'disk.dataPartition.size=2048M\n' >> "$HOME/.android/avd/test.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: bash ../.github/scripts/android-brand-shots.sh

      - name: Save screenshots to apk-builds branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -d /tmp/brand-shots || { echo "no screenshots"; exit 0; }
          ver=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | head -1 | cut -d'"' -f2)
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/apk-repo
          git clone --quiet --depth=1 --branch apk-builds "$repo_url" /tmp/apk-repo
          mkdir -p "/tmp/apk-repo/screens/$ver"
          cp /tmp/brand-shots/* "/tmp/apk-repo/screens/$ver/"
          echo "run ${GITHUB_RUN_ID} commit ${GITHUB_SHA} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "/tmp/apk-repo/screens/$ver/run.txt"
          cd /tmp/apk-repo
          git config user.name "winstone-apk-bot"
          git config user.email "winstone-apk-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Brand screenshots $ver (run ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --quiet --rebase "$repo_url" apk-builds && git push --quiet "$repo_url" HEAD:apk-builds && break; sleep 5; done
