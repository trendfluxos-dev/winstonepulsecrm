name: Android UI tests

# Runs the Android unit tests plus the instrumented Compose UI tests
# (e.g. ShortRejectionReportUiTest) on an emulator. Tests target only the
# offline "sandbox" build (CRM_BASE_URL=https://invalid.invalid), so no
# real CRM, customer or production data is touched. No secrets are used.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ui-tests.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ui-tests.yml"

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The emulator needs ~8 GB (6 GB default userdata partition + system
      # image); the preinstalled image bloat left only ~5.9 GB free, and the
      # emulator died at launch with "Not enough space to create userdata
      # partition" (run 41119298407). Reclaim space before installing the SDK.
      - name: Free disk space for the SDK and emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
            /usr/lib/mono /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list includes the retired legacy "tools"
      # package, which sdkmanager no longer finds ("Failed to find package
      # 'tools'", exit 1). Install exactly what the build needs instead:
      # compileSdk 35 (app/build.gradle.kts) and AGP 8.7.3's default
      # build-tools 34.0.0 (no buildToolsVersion override in the project).
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: Export one SDK location for Gradle and the emulator
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Point Gradle at the CI Android SDK (sandbox URL only)
        working-directory: android
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented UI tests (sandbox build on emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: ./gradlew --no-daemon connectedSandboxAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
