name: Android CI (build + tests, no signing)

# Check for every pull request and main push that touches the phone app:
# compiles the app and runs its full JVM unit-test suite for all build types
# (debug, sandbox, release). It never reads signing secrets, never signs,
# never pushes to any branch and never creates a release.
# Instrumented UI tests run separately in android-ui-tests.yml (emulator).

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at the CI Android SDK (no signing settings)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests for every build type, plus unsigned debug and sandbox APKs
        run: chmod +x gradlew && ./gradlew --no-daemon test assembleDebug assembleSandbox
      - name: Summarise test results
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = 0
          for p in glob.glob("app/build/test-results/*/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0))
          print(f"Android unit tests: {t} run, {f} failures, {e} errors (debug, sandbox, release)")
          EOF
      # Test reports are a convenience copy; artifact storage quota must not fail the check.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7
