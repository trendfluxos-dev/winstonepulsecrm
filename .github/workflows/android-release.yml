name: Android tagged release

# On a version tag (v1.2.3), builds the signed release APK, computes its
# SHA-256, and publishes both to a GitHub Release. Signing comes only from
# encrypted repo secrets; the keystore is never committed. Fails closed when
# signing secrets are missing so an unsigned/test build is never released.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Build signed release APK
        env:
          WINSTONE_KEYSTORE_B64: ${{ secrets.WINSTONE_KEYSTORE_B64 }}
          WINSTONE_KEYSTORE_PASSWORD: ${{ secrets.WINSTONE_KEYSTORE_PASSWORD }}
          WINSTONE_KEY_ALIAS: ${{ secrets.WINSTONE_KEY_ALIAS }}
          WINSTONE_KEY_PASSWORD: ${{ secrets.WINSTONE_KEY_PASSWORD }}
        run: |
          test -n "$WINSTONE_KEYSTORE_B64" || { echo "Release signing secrets missing"; exit 1; }
          echo "$WINSTONE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          WINSTONE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify app/build/outputs/apk/release/*.apk
      - name: Name APK and compute SHA-256
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          APK="$RUNNER_TEMP/out/winstone-agent-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          (cd "$RUNNER_TEMP/out" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          cat "$APK.sha256"
          echo "dir=$RUNNER_TEMP/out" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "$APK.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: winstone-agent-release-${{ github.ref_name }}
          path: ${{ steps.pack.outputs.dir }}/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.dir }}"/* \
            --repo "$GITHUB_REPOSITORY" --title "Winstone Agent $GITHUB_REF_NAME" \
            --notes "Signed release APK. SHA-256: \`${{ steps.pack.outputs.sha }}\` — verify before installing." \
            || gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.dir }}"/* --repo "$GITHUB_REPOSITORY" --clobber
