name: Android APKs

# Builds the Winstone Android companion (call-log tracing, recording pickup,
# post-call reports).
# - debug job: always builds/uploads the side-by-side test APK (com.winstone.connect.test).
#   It never needs signing secrets.
# - release job: runs only when all four signing secrets exist; otherwise it is
#   skipped with a notice. The keystore lives only in $RUNNER_TEMP and is always removed.
# This workflow never creates a GitHub Release (see android-release.yml for tags).

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

env:
  EXPECTED_VERSION_NAME: "2.21"
  EXPECTED_VERSION_CODE: "32"

# The apk-builds branch is our quota-independent fallback storage for built APKs:
# GITHUB_TOKEN only needs contents:write for that push.
permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Refuse committed signing material in the build tree
        run: |
          if [ -f local.properties ]; then echo "android/local.properties must not be committed"; exit 1; fi
      - name: Check declared app version
        run: |
          grep -q "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts
          grep -q "versionCode = $EXPECTED_VERSION_CODE\b" app/build.gradle.kts
      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify debug package id and version, write checksum file
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$BT/aapt2" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "name='com.winstone.connect.test'" /tmp/badging.txt
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" /tmp/badging.txt
          grep -q "versionName='$EXPECTED_VERSION_NAME-test'" /tmp/badging.txt
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256" && cat "$(basename "$APK").sha256")
      - name: Save debug APK to apk-builds branch
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          apk_name=$(basename "$apk_path")
          sha=$(sha256sum "$apk_path" | awk '{print $1}')
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/apk-repo
          if git ls-remote --exit-code --heads "$repo_url" apk-builds >/dev/null 2>&1; then
            git clone --quiet --depth=1 --branch apk-builds "$repo_url" /tmp/apk-repo
          else
            git init --quiet -b apk-builds /tmp/apk-repo
          fi
          cp "$apk_path" "$apk_path.sha256" /tmp/apk-repo/
          (cd /tmp/apk-repo && sha256sum -c "$apk_name.sha256")
          {
            echo "package: com.winstone.connect.test"
            echo "version: ${EXPECTED_VERSION_NAME}-test (versionCode ${EXPECTED_VERSION_CODE})"
            echo "sha256: $sha"
            echo "build: run ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA})"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "/tmp/apk-repo/build-info.txt"
          cd /tmp/apk-repo
          git config user.name "winstone-apk-bot"
          git config user.email "winstone-apk-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Test APK ${apk_name} (build ${GITHUB_RUN_NUMBER})"
          git push --quiet "$repo_url" HEAD:apk-builds
          echo "Pushed to apk-builds: $apk_name (sha256 $sha)"
      # GitHub artifact storage is a convenience copy only: the verified APK and its
      # checksum are already on the apk-builds branch. A quota failure here must not
      # turn a good build red, but it is reported as a distinct warning.
      - uses: actions/upload-artifact@v4
        id: upload_debug
        continue-on-error: true
        with:
          name: winstone-agent-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk.sha256
          if-no-files-found: error
      - name: Report artifact upload result
        if: always()
        working-directory: .
        env:
          UPLOAD: ${{ steps.upload_debug.outcome }}
        run: |
          if [ "$UPLOAD" = "failure" ]; then
            msg="Test APK built, verified and saved to the apk-builds branch. The extra GitHub artifact copy was NOT uploaded (usually artifact storage quota). This is not a build failure."
            echo "::warning::$msg"
          else
            msg="Test APK artifact upload: ${UPLOAD:-not run}"
          fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      # Official build gate: all four signing secrets AND the approved signer
      # fingerprint variable must exist before any key material is decoded.
      # Only names are reported, never values.
      - name: Check signing secrets and approved fingerprint
        id: secrets
        working-directory: .
        env:
          A: ${{ secrets.WINSTONE_KEYSTORE_B64 }}
          B: ${{ secrets.WINSTONE_KEYSTORE_PASSWORD }}
          C: ${{ secrets.WINSTONE_KEY_ALIAS }}
          D: ${{ secrets.WINSTONE_KEY_PASSWORD }}
          F: ${{ vars.WINSTONE_RELEASE_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$A" ] || missing="$missing WINSTONE_KEYSTORE_B64"
          [ -n "$B" ] || missing="$missing WINSTONE_KEYSTORE_PASSWORD"
          [ -n "$C" ] || missing="$missing WINSTONE_KEY_ALIAS"
          [ -n "$D" ] || missing="$missing WINSTONE_KEY_PASSWORD"
          [ -n "$F" ] || missing="$missing WINSTONE_RELEASE_CERT_SHA256(variable)"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Official release BLOCKED, nothing signed. Missing:$missing. The test APK is unaffected."
            echo "Official release: BLOCKED — missing:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Refuse committed signing material
        if: steps.secrets.outputs.ready == 'true'
        working-directory: .
        run: |
          # Names only: a key file in the repository is untrusted and blocks an official build.
          FOUND=$(git ls-files | grep -Ei '\.(jks|keystore|p12|pfx|pepk)(\.(gpg|b64))?$' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Official release BLOCKED: signing material is committed in the repository: $FOUND"
            echo "Official release: BLOCKED — committed signing material: $FOUND" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Check declared app version
        if: steps.secrets.outputs.ready == 'true'
        run: |
          grep -q "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts
          grep -q "versionCode = $EXPECTED_VERSION_CODE\b" app/build.gradle.kts
      - name: Build signed release APK
        if: steps.secrets.outputs.ready == 'true'
        env:
          WINSTONE_KEYSTORE_B64: ${{ secrets.WINSTONE_KEYSTORE_B64 }}
          WINSTONE_KEYSTORE_PASSWORD: ${{ secrets.WINSTONE_KEYSTORE_PASSWORD }}
          WINSTONE_KEY_ALIAS: ${{ secrets.WINSTONE_KEY_ALIAS }}
          WINSTONE_KEY_PASSWORD: ${{ secrets.WINSTONE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/winstone-release.jks"
          trap 'rm -f "$KS"' EXIT
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$WINSTONE_KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          chmod +x gradlew
          WINSTONE_KEYSTORE_PATH="$KS" ./gradlew --no-daemon assembleRelease
      - name: Remove keystore (always)
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/winstone-release.jks"
      - name: Verify signer fingerprint, package id and version, write checksum file
        if: steps.secrets.outputs.ready == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.WINSTONE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" /tmp/certs.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          WANT=$(echo "${EXPECTED_CERT_SHA256:-}" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$WANT" ]; then
            echo "::error::Set repository variable WINSTONE_RELEASE_CERT_SHA256 to the canonical signer fingerprint. Actual: $ACTUAL"; exit 1
          fi
          [ "$ACTUAL" = "$WANT" ] || { echo "::error::Signer fingerprint mismatch: $ACTUAL"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "name='com.winstone.connect'" /tmp/badging.txt
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" /tmp/badging.txt
          grep -q "versionName='$EXPECTED_VERSION_NAME'" /tmp/badging.txt
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256" && cat "$(basename "$APK").sha256")
          echo "Official release APK verified: signer $ACTUAL, com.winstone.connect $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save signed release APK to apk-builds branch
        if: steps.secrets.outputs.ready == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path=$(ls android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          apk_name=$(basename "$apk_path")
          sha=$(sha256sum "$apk_path" | awk '{print $1}')
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/apk-repo
          if git ls-remote --exit-code --heads "$repo_url" apk-builds >/dev/null 2>&1; then
            git clone --quiet --depth=1 --branch apk-builds "$repo_url" /tmp/apk-repo
          else
            git init --quiet -b apk-builds /tmp/apk-repo
          fi
          cp "$apk_path" "$apk_path.sha256" /tmp/apk-repo/
          (cd /tmp/apk-repo && sha256sum -c "$apk_name.sha256")
          {
            echo "package: com.winstone.connect"
            echo "version: ${EXPECTED_VERSION_NAME} (versionCode ${EXPECTED_VERSION_CODE})"
            echo "sha256: $sha"
            echo "build: run ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA})"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "/tmp/apk-repo/build-info-release.txt"
          cd /tmp/apk-repo
          git config user.name "winstone-apk-bot"
          git config user.email "winstone-apk-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Release APK ${apk_name} (build ${GITHUB_RUN_NUMBER})"
          git push --quiet "$repo_url" HEAD:apk-builds
          echo "Pushed to apk-builds: $apk_name (sha256 $sha)"
      - uses: actions/upload-artifact@v4
        id: upload_release
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        with:
          name: winstone-agent-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk.sha256
            !android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
      - name: Report artifact upload result
        if: always() && steps.secrets.outputs.ready == 'true'
        working-directory: .
        env:
          UPLOAD: ${{ steps.upload_release.outcome }}
        run: |
          if [ "$UPLOAD" = "failure" ]; then
            msg="Official APK built, verified and saved to the apk-builds branch. The extra GitHub artifact copy was NOT uploaded (usually artifact storage quota). This is not a build failure."
            echo "::warning::$msg"
          else
            msg="Official APK artifact upload: ${UPLOAD:-not run}"
          fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
