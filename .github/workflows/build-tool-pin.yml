name: Build tool pin

# Guards against @lovable.dev/vite-tanstack-config drifting off 2.25.2.
# 2.26.0 crashes every page on the live Worker (createRequire(import.meta.url))
# while the dev preview keeps working, so this must fail before any publish.

on:
  push:
  pull_request:

jobs:
  check-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned build tool version
        run: node scripts/check-build-tool-pin.mjs
      - name: Run pin regression test
        # Isolated, pinned Vitest: installing into the repo would apply package.json
        # overrides against the direct devDependency and fail with EOVERRIDE.
        # The test only reads package.json, so it runs from a temp copy with no repo config.
        env:
          VITEST_VERSION: "5.0.3"
        run: |
          set -euo pipefail
          TOOL="$RUNNER_TEMP/pin-vitest"; RUN="$RUNNER_TEMP/pin-run"
          mkdir -p "$TOOL" "$RUN/tests"
          (cd "$TOOL" && npm init -y >/dev/null && npm install --no-audit --no-fund --ignore-scripts "vitest@$VITEST_VERSION")
          cp package.json "$RUN/package.json"
          cp tests/build-config-pin.test.ts "$RUN/tests/"
          ln -s "$TOOL/node_modules" "$RUN/node_modules"
          cd "$RUN" && ./node_modules/.bin/vitest run tests/build-config-pin.test.ts

  dashboard-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dashboards use semantic colour tokens only
        run: node scripts/check-dashboard-colors.mjs

  manual-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manual PDF matches docs/CRM_OPERATIONS_MANUAL.md
        run: node scripts/manual/manual-meta.mjs check
